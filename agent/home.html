<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Agent Route - Up Field</title>
  
  <!-- Leaflet CSS for Live Uber-Style Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Shared Theme Variables */
    :root {
      --bg-color: #f4f7f6;
      --surface-color: #ffffff;
      --surface-card: #ffffff;
      --text-main: #111827;
      --text-sub: #6b7280;
      --border: #e5e7eb;
      --primary: #10B981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.15);
      --skeleton-base: #e5e7eb;
      --skeleton-highlight: #f3f4f6;
    }

    /* THE PROFESSIONAL DARK MAP FILTER APPLIED HERE */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #121212;
        --surface-card: #1e1e1e;
        --text-main: #f9fafb;
        --text-sub: #9ca3af;
        --border: #2d3748;
        --shadow: 0 8px 30px -5px rgba(0, 0, 0, 0.6);
        --skeleton-base: #2d3748;
        --skeleton-highlight: #3f4a5e;
        /* Advanced CSS Filter: Turns bright white Google map into sleek dark dashboard while preserving clarity */
        --map-filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(95%);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none !important; }
    body { background-color: var(--bg-color); color: var(--text-main); overflow: hidden; }

    /* --- Screen Management --- */
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1); z-index: 1; background: var(--bg-color); }
    .screen.hidden { opacity: 0; pointer-events: none; z-index: -1; }
    
    /* --- Header (Hidden for Full Screen Map) --- */
    .header { padding: 15px 20px; display: none !important; align-items: center; justify-content: space-between; background: var(--surface-color); z-index: 20; position: relative; border-bottom: 1px solid var(--border); }
    .header h2 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .agent-dp { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }

    /* --- Route Gradients --- */
    .grad-1 { background: linear-gradient(135deg, #FF6B6B, #C0392B) !important; color: white !important; }
    .grad-2 { background: linear-gradient(135deg, #4FACFE, #00F2FE) !important; color: white !important; }
    .grad-3 { background: linear-gradient(135deg, #43E97B, #38F9D7) !important; color: #0f4c2e !important; }
    .grad-4 { background: linear-gradient(135deg, #FA709A, #FEE140) !important; color: #5a1a2b !important; }
    .grad-5 { background: linear-gradient(135deg, #667EEA, #764BA2) !important; color: white !important; }
    .grad-6 { background: linear-gradient(135deg, #232526, #414345) !important; color: white !important; }

    /* --- Start Screen --- */
    .start-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .btn-start-route { width: 100%; max-width: 320px; padding: 25px; border-radius: 24px; border: none; font-size: 1.4rem; font-weight: 800; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .btn-start-route:active { transform: scale(0.95); }
    .btn-start-route span { font-size: 0.9rem; font-weight: 600; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }

    /* --- Live Map Screen --- */
    #map-container { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: var(--bg-color); filter: var(--map-filter, none); }
    
    /* Floating Map Controls */
    .map-controls { position: absolute; top: calc(env(safe-area-inset-top) + 20px); right: 15px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
    .btn-map-icon { background: var(--surface-card); border: 2px solid var(--border); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); cursor: pointer; color: var(--text-main); transition: all 0.2s; }
    .btn-map-icon:active { transform: scale(0.9); }
    .btn-map-icon.locked { color: #3b82f6; border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

    /* --- Bottom Sheet Routing Engine (Swipeable) --- */
    .route-panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 35vh; background: var(--surface-card); z-index: 10; border-top-left-radius: 30px; border-top-right-radius: 30px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); transition: height 0.35s cubic-bezier(0.175, 0.885, 0.32, 1); display: flex; flex-direction: column; will-change: height; }
    .route-panel.expanded { height: 85vh; }
    
    /* Progress Bar Header */
    .panel-progress-bg { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: rgba(16, 185, 129, 0.1); border-top-left-radius: 30px; border-top-right-radius: 30px; overflow: hidden; }
    .panel-progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease; }

    .panel-handle-area { padding: 15px 0; display: flex; justify-content: center; cursor: grab; flex-shrink: 0; touch-action: none; position: relative; }
    .panel-handle-area:active { cursor: grabbing; }
    .panel-handle { width: 50px; height: 6px; background: var(--border); border-radius: 10px; }

    .panel-content { padding: 0 20px 30px 20px; overflow-y: auto; flex: 1; position: relative; }

    /* --- Sleek Compact "Next Stop" Card --- */
    .next-stop-header { font-size: 0.75rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
    .next-stop-header .pulse-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: pulseLoc 1.5s infinite; }
    @keyframes pulseLoc { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

    .cust-main-name { font-size: 1.4rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .dist-text { color: var(--text-sub); font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; }

    /* Compact Action Icons */
    .icon-circle { width: 42px; height: 42px; border-radius: 50%; background: var(--bg-color); border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; color: var(--text-main); text-decoration: none; cursor: pointer; transition: transform 0.1s; flex-shrink: 0; }
    .icon-circle:active { transform: scale(0.9); background: var(--border); }
    .icon-circle svg { width: 20px; height: 20px; stroke-width: 2.5; }

    .btn-collect { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 1.15rem; font-weight: 800; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); cursor: pointer; transition: transform 0.1s; margin-top: 15px; }
    .btn-collect:active { transform: scale(0.96); }

    /* Mini Cards for Expanded List */
    .sticky-filter { position: sticky; top: 0; background: var(--surface-card); z-index: 5; padding: 10px 0; margin-bottom: 5px; }
    .filter-input { width: 100%; padding: 12px 15px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg-color); color: var(--text-main); font-weight: 600; outline: none; transition: border-color 0.2s; font-size: 0.95rem; }
    .filter-input:focus { border-color: var(--primary); }

    .section-title { font-size: 0.85rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 10px 0; }
    .mini-card { background: var(--bg-color); border: 1px solid var(--border); padding: 15px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: opacity 0.2s, display 0.2s; }
    .mini-info h4 { font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
    
    .mini-actions { display: flex; gap: 8px; align-items: center; }
    .btn-visit-again { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 800; font-size: 0.8rem; cursor: pointer; }

    /* Jump to Top Button */
    .btn-jump-top { position: fixed; bottom: 25px; right: 20px; width: 50px; height: 50px; background: var(--primary); color: white; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); cursor: pointer; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; transform: translateY(20px); }
    .btn-jump-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .btn-jump-top:active { transform: scale(0.9); }
    .btn-jump-top svg { width: 24px; height: 24px; stroke-width: 2.5; }

    /* Loaders */
    .loader-circle { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <!-- ================= SCREEN 1: "GOOD MORNING" START ================= -->
  <div id="screen-start" class="screen">
    <div class="header" style="justify-content: center; padding: 25px 20px; display: none !important;">
      <h2 style="font-size: 1.5rem;">Up Field</h2>
    </div>
    
    <div class="start-content">
      <div id="start-loader" class="loader-circle" style="display: block;"></div>
      
      <div id="start-ui" style="display: none; width: 100%; align-items: center; flex-direction: column;">
          <h3 id="greeting-text" style="font-size: 1.8rem; font-weight: 800; margin-bottom: 5px;">Good Morning</h3>
          <p id="date-text" style="color: var(--text-sub); font-weight: 700; margin-bottom: 40px; font-size: 1.1rem;"></p>
          
          <div id="no-route-msg" style="display: none; color: var(--danger); font-weight: 800; background: rgba(239,68,68,0.1); padding: 15px 25px; border-radius: 16px;">
              You have no route assigned for today.
          </div>

          <button id="btn-start" class="btn-start-route grad-6" style="display: none;" onclick="initializeRouteCache()">
              <span>Start Route</span>
              <div id="start-line-name">Loading...</div>
          </button>
      </div>
    </div>
  </div>

  <!-- ================= SCREEN 2: LIVE UBER MAP & ROUTING ================= -->
  <div id="screen-route" class="screen hidden">
    
    <!-- Leaflet Map Container -->
    <div id="map-container"></div>
    
    <div class="map-controls">
        <button class="btn-map-icon locked" id="btn-map-lock" onclick="toggleMapLock()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        </button>
        <button class="btn-map-icon" onclick="centerMapOnAgent()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
        </button>
    </div>

    <!-- Swipeable Bottom Sheet -->
    <div class="route-panel" id="route-panel">
        
        <!-- Advanced Feature: Dynamic Progress Bar -->
        <div class="panel-progress-bg">
            <div class="panel-progress-fill" id="route-progress-bar"></div>
        </div>

        <!-- Draggable Handle Area (Vibration Trigger Attached Here) -->
        <div class="panel-handle-area" id="panel-drag-handle">
            <div class="panel-handle"></div>
        </div>

        <div class="panel-content" id="panel-content">
            <!-- 1. The Nearest "Next Stop" Section -->
            <div id="next-stop-section">
                <!-- Injected via JS -->
            </div>

            <!-- 2. The Expanded List Section -->
            <div id="expanded-list-section" style="display: none;">
                
                <!-- Advanced Feature: Live Route Search -->
                <div class="sticky-filter">
                    <input type="text" class="filter-input" id="route-filter" placeholder="Find customer in route...">
                </div>

                <div class="section-title" id="up-next-title">Up Next (<span id="up-next-count">0</span>)</div>
                <div id="up-next-list"></div>

                <div class="section-title" id="skipped-title" style="display: none;">Skipped Today</div>
                <div id="skipped-list"></div>
            </div>
            
            <div id="all-done-msg" style="display:none; text-align:center; padding: 40px 20px;">
                <div style="font-size:4rem; margin-bottom:15px;">🎉</div>
                <h3 style="font-size:1.5rem; font-weight:800; color:var(--primary); margin-bottom:10px;">Route Complete!</h3>
                <p style="color:var(--text-sub); font-weight:600;">You have collected or skipped all stops for today.</p>
            </div>
        </div>

        <!-- Advanced Feature: Jump to Top -->
        <button class="btn-jump-top" id="btn-jump-top" onclick="jumpToTop()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>

    </div>
  </div>

  <!-- Leaflet JS for Map -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { auth, db } from './config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // --- Global State ---
    let currentUser = null;
    let todayLineId = null;
    let todayLineData = null;
    let localRouteData = [];
    let agentLocation = { lat: 8.7642, lon: 78.1348 }; // Default: Thoothukudi
    
    // Map State
    let map = null;
    let agentMarker = null;
    let customerMarkers = {};
    let isMapLocked = true; // Controls Auto-Snapping vs Free Roam

    const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const todayStr = daysOfWeek[new Date().getDay()];
    const todayDate = new Date().toISOString().split('T')[0];
    const cacheKey = `route_data_${todayDate}`;

    // Haptic Feedback Engine
    const vibrate = (ms = 30) => { if(navigator.vibrate) navigator.vibrate(ms); };

    // --- 1. Initialization & Auth ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('greeting-text').innerText = getGreeting();
            document.getElementById('date-text').innerText = new Date().toLocaleDateString('en-IN', { weekday: 'long', month: 'long', day: 'numeric' });
            
            cleanOldCaches();
            await checkAgentSchedule();
        }
    });

    function getGreeting() {
        const hour = new Date().getHours();
        if(hour < 12) return "Good Morning";
        if(hour < 17) return "Good Afternoon";
        return "Good Evening";
    }

    function cleanOldCaches() {
        Object.keys(localStorage).forEach(key => {
            if(key.startsWith('route_data_') && key !== cacheKey) {
                localStorage.removeItem(key);
            }
        });
    }

    async function checkAgentSchedule() {
        try {
            const existingCache = localStorage.getItem(cacheKey);
            if(existingCache) {
                localRouteData = JSON.parse(existingCache);
                document.getElementById('screen-start').classList.add('hidden');
                document.getElementById('screen-route').classList.remove('hidden');
                startUberEngine();
                return;
            }

            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
            if(!userDoc.exists()) throw new Error("Agent profile not found.");
            
            const schedule = userDoc.data().schedule || {};
            todayLineId = schedule[todayStr];

            document.getElementById('start-loader').style.display = 'none';
            document.getElementById('start-ui').style.display = 'flex';

            if(!todayLineId) {
                document.getElementById('no-route-msg').style.display = 'block';
            } else {
                const lineDoc = await getDoc(doc(db, "lines", todayLineId));
                if(lineDoc.exists()) todayLineData = lineDoc.data();
                
                const btn = document.getElementById('btn-start');
                btn.style.display = 'flex';
                btn.className = `btn-start-route ${todayLineData ? (todayLineData.color || 'grad-6') : 'grad-6'}`;
                document.getElementById('start-line-name').innerText = todayLineData ? todayLineData.name : todayLineId;
            }

        } catch (error) {
            console.error("Schedule Check Failed:", error);
            alert("Network error. Please reload.");
        }
    }

    // --- 2. The Batch Fetch (No Financial Cache Saved) ---
    window.initializeRouteCache = async () => {
        vibrate();
        document.getElementById('start-ui').style.display = 'none';
        document.getElementById('start-loader').style.display = 'block';

        try {
            const q = query(collection(db, "customers"), where("lineId", "==", todayLineId));
            const snap = await getDocs(q);
            
            localRouteData = [];

            snap.forEach(d => {
                const c = d.data();
                let totalPending = 0;
                
                // Calculate Live Pending purely to filter out paid-off customers
                if(c.products) {
                    c.products.forEach(p => {
                        const pTotal = parseInt(p.total) || parseInt(p.amount) || 0;
                        let pPaid = 0;
                        if(p.payments) p.payments.forEach(pay => pPaid += (parseInt(pay.amount) || 0));
                        totalPending += Math.max(0, pTotal - pPaid);
                    });
                }

                // If they owe money, push them to the routing manifest (Amount is NOT saved)
                if(totalPending > 0) {
                    let lat = 0, lon = 0;
                    if(c.location && c.location.includes(',')) {
                        const pts = c.location.split(',');
                        lat = parseFloat(pts[0].trim());
                        lon = parseFloat(pts[1].trim());
                    }

                    localRouteData.push({
                        id: c.id,
                        name: c.name,
                        phone: c.phone || '',
                        lat: lat,
                        lon: lon,
                        status: 'pending', 
                        active: true       
                    });
                }
            });

            // Save clean manifest to storage
            localStorage.setItem(cacheKey, JSON.stringify(localRouteData));
            
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-route').classList.remove('hidden');
            
            startUberEngine();

        } catch(e) {
            console.error("Cache build failed", e);
            alert("Failed to download route.");
            document.getElementById('start-ui').style.display = 'flex';
            document.getElementById('start-loader').style.display = 'none';
        }
    };

    // --- 3. The Uber GPS & Math Engine ---
    function startUberEngine() {
        initLeafletMap();
        pingGPS(); 
        
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => updateLocationData(pos.coords.latitude, pos.coords.longitude),
                (err) => console.warn("Watch GPS Denied.", err),
                { enableHighAccuracy: true, maximumAge: 10000 }
            );
            setInterval(pingGPS, 10000);
        } else {
            recalculateAndRender();
        }
    }

    function pingGPS() {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => updateLocationData(pos.coords.latitude, pos.coords.longitude),
                (err) => console.warn("Ping GPS Denied.", err),
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }
    }

    function updateLocationData(lat, lon) {
        agentLocation.lat = lat;
        agentLocation.lon = lon;
        updateAgentMarker();
        recalculateAndRender();
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        if(!lat1 || !lon1 || !lat2 || !lon2) return 9999;
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function recalculateAndRender() {
        localRouteData.forEach(c => { c.distance = getDistance(agentLocation.lat, agentLocation.lon, c.lat, c.lon); });

        const activeList = localRouteData.filter(c => c.active === true && c.status === 'pending');
        const skippedList = localRouteData.filter(c => c.active === true && c.status === 'skipped');

        activeList.sort((a, b) => a.distance - b.distance);
        skippedList.sort((a, b) => a.distance - b.distance);

        // Update Progress Bar
        const totalInitialStops = localRouteData.length;
        const currentActiveStops = activeList.length + skippedList.length;
        const completedStops = totalInitialStops - currentActiveStops;
        const progressPercent = totalInitialStops > 0 ? Math.round((completedStops / totalInitialStops) * 100) : 0;
        document.getElementById('route-progress-bar').style.width = `${progressPercent}%`;

        renderUI(activeList, skippedList);
        updateMapPins(activeList);
    }

    // --- 4. Dynamic Queue UI Rendering (1, 2, 3...) ---
    function renderUI(activeList, skippedList) {
        const nextStopSection = document.getElementById('next-stop-section');
        const upNextList = document.getElementById('up-next-list');
        const upNextTitle = document.getElementById('up-next-title');
        const skippedContainer = document.getElementById('skipped-list');
        const skippedTitle = document.getElementById('skipped-title');
        const allDoneMsg = document.getElementById('all-done-msg');

        if(activeList.length === 0 && skippedList.length === 0) {
            nextStopSection.innerHTML = '';
            upNextList.innerHTML = '';
            upNextTitle.style.display = 'none';
            skippedContainer.innerHTML = '';
            skippedTitle.style.display = 'none';
            allDoneMsg.style.display = 'block';
            document.getElementById('route-panel').classList.remove('expanded');
            document.getElementById('route-panel').style.height = ''; 
            return;
        }
        
        allDoneMsg.style.display = 'none';
        upNextTitle.style.display = activeList.length > 1 ? 'block' : 'none';
        document.getElementById('up-next-count').innerText = Math.max(0, activeList.length - 1);

        // Render Nearest Customer Card (Stop #1)
        if(activeList.length > 0) {
            const nearest = activeList[0];
            const distStr = nearest.distance < 9999 ? `${nearest.distance.toFixed(1)} km` : "Unknown";
            const mapLink = `https://maps.google.com/?daddr=${nearest.lat},${nearest.lon}`;
            
            nextStopSection.innerHTML = `
                <div class="next-stop-header"><div class="pulse-dot"></div> NEXT STOP</div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="flex: 1; padding-right: 10px;">
                        <div class="cust-main-name">${nearest.name}</div>
                        <div class="dist-text">
                            <span style="color:var(--primary); font-weight:800; font-size:1.15rem; margin-right:8px; letter-spacing:0.5px;">📍 Stop #1</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> ${distStr}
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <a href="${mapLink}" target="_blank" class="icon-circle" title="Navigate">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                        </a>
                        <a href="tel:${nearest.phone}" class="icon-circle" title="Call">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#10B981"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        </a>
                        <button class="icon-circle" onclick="window.actionSkip('${nearest.id}')" title="Skip">
                            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-sub)"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
                <button class="btn-collect" onclick="window.actionCollect('${nearest.id}')">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle></svg>
                    Collect Payment
                </button>
            `;
        } else {
            nextStopSection.innerHTML = `<div class="next-stop-header" style="color:var(--text-sub);">No active stops remaining. Swipe up to see skipped.</div>`;
        }

        // Render Expanded Up Next List (Stop #2, #3, etc.)
        let upNextHtml = '';
        for(let i = 1; i < activeList.length; i++) {
            const c = activeList[i];
            const distStr = c.distance < 9999 ? `${c.distance.toFixed(1)} km` : "N/A";
            const stopNum = i + 1; // Dynamic Queue Math
            upNextHtml += `
                <div class="mini-card active-card-item" data-name="${c.name.toLowerCase()}">
                    <div class="mini-info">
                        <h4>${c.name}</h4>
                        <p style="color:var(--primary); font-weight:800; font-size:0.9rem;">#${stopNum} <span style="color:var(--text-sub); margin-left:4px; font-weight:700;">• ${distStr}</span></p>
                    </div>
                    <div class="mini-actions">
                        <a href="tel:${c.phone}" class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="#10B981"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></a>
                        <a href="https://maps.google.com/?daddr=${c.lat},${c.lon}" target="_blank" class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg></a>
                        <button class="icon-circle" style="background:var(--primary); color:white; border:none;" onclick="window.actionCollect('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle></svg></button>
                    </div>
                </div>
            `;
        }
        upNextList.innerHTML = upNextHtml;

        // Render Skipped List
        if(skippedList.length > 0) {
            skippedTitle.style.display = 'block';
            let skipHtml = '';
            skippedList.forEach(c => {
                skipHtml += `
                    <div class="mini-card skipped-card-item" data-name="${c.name.toLowerCase()}" style="opacity:0.75;">
                        <div class="mini-info">
                            <h4 style="text-decoration: line-through;">${c.name}</h4>
                            <p style="color:var(--text-sub);">Skipped</p>
                        </div>
                        <button class="btn-visit-again" onclick="window.actionUnskip('${c.id}')">Visit Again</button>
                    </div>
                `;
            });
            skippedContainer.innerHTML = skipHtml;
        } else {
            skippedTitle.style.display = 'none';
            skippedContainer.innerHTML = '';
        }
        
        // Re-apply current filter if any
        runLiveFilter();
    }

    // --- 5. Advanced Interactive Features & Haptics ---
    
    // Feature A: Live Route Filter
    const routeFilter = document.getElementById('route-filter');
    routeFilter.addEventListener('input', runLiveFilter);
    function runLiveFilter() {
        const term = routeFilter.value.toLowerCase().trim();
        document.querySelectorAll('.active-card-item, .skipped-card-item').forEach(card => {
            if(term === "" || card.dataset.name.includes(term)) {
                card.style.display = 'flex';
            } else {
                card.style.display = 'none';
            }
        });
    }

    // Feature B: Jump to Top
    const panelContent = document.getElementById('panel-content');
    const btnJumpTop = document.getElementById('btn-jump-top');
    panelContent.addEventListener('scroll', () => {
        if(panelContent.scrollTop > 300) {
            btnJumpTop.classList.add('visible');
        } else {
            btnJumpTop.classList.remove('visible');
        }
    });
    window.jumpToTop = () => {
        vibrate(15);
        panelContent.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Feature C: Native Pull-to-Collapse Physics with Haptics
    const panel = document.getElementById('route-panel');
    const dragHandle = document.getElementById('panel-drag-handle');
    let startY = 0;
    let startHeight = 0;
    let isDraggingContent = false;

    // Handle Dragging
    dragHandle.addEventListener('touchstart', (e) => {
        vibrate(10); // Micro-tick on grab
        startY = e.touches[0].clientY;
        startHeight = panel.clientHeight;
        panel.style.transition = 'none'; 
    }, {passive: true});
    
    dragHandle.addEventListener('touchmove', (e) => {
        const newHeight = startHeight + (startY - e.touches[0].clientY);
        if(newHeight > window.innerHeight * 0.25 && newHeight < window.innerHeight * 0.9) {
            panel.style.height = newHeight + 'px';
        }
    }, {passive: true});
    
    dragHandle.addEventListener('touchend', finalizeDrag);

    // Content Dragging (Only pull down when at the top of scroll)
    panelContent.addEventListener('touchstart', (e) => {
        if (panelContent.scrollTop <= 0) {
            startY = e.touches[0].clientY;
            startHeight = panel.clientHeight;
            isDraggingContent = true;
            panel.style.transition = 'none';
        }
    }, {passive: true});
    
    panelContent.addEventListener('touchmove', (e) => {
        if (!isDraggingContent) return;
        const deltaY = startY - e.touches[0].clientY;
        if (deltaY < 0) { // Only allow dragging DOWN to collapse
            panel.style.height = (startHeight + deltaY) + 'px';
        }
    }, {passive: true});
    
    panelContent.addEventListener('touchend', () => {
        if(isDraggingContent) { isDraggingContent = false; finalizeDrag(); }
    });

    function finalizeDrag() {
        panel.style.transition = 'height 0.35s cubic-bezier(0.175, 0.885, 0.32, 1)';
        if (panel.clientHeight > window.innerHeight * 0.55) {
            if(!panel.classList.contains('expanded')) vibrate(30); // Solid snap up
            panel.classList.add('expanded');
            document.getElementById('expanded-list-section').style.display = 'block';
        } else {
            if(panel.classList.contains('expanded')) vibrate(20); // Quick snap down
            panel.classList.remove('expanded');
            document.getElementById('expanded-list-section').style.display = 'none';
        }
        panel.style.height = ''; 
    }

    // Manual Click Toggle fallback
    window.toggleRoutePanel = () => {
        if(panel.classList.contains('expanded')) {
            vibrate(20);
            panel.classList.remove('expanded');
            document.getElementById('expanded-list-section').style.display = 'none';
        } else {
            vibrate(30);
            panel.classList.add('expanded');
            document.getElementById('expanded-list-section').style.display = 'block';
        }
        panel.style.height = ''; 
    };

    window.actionSkip = (id) => {
        vibrate();
        const idx = localRouteData.findIndex(c => c.id === id);
        if(idx !== -1) {
            localRouteData[idx].status = 'skipped';
            localStorage.setItem(cacheKey, JSON.stringify(localRouteData));
            recalculateAndRender();
        }
    };

    window.actionUnskip = (id) => {
        vibrate();
        const idx = localRouteData.findIndex(c => c.id === id);
        if(idx !== -1) {
            localRouteData[idx].status = 'pending';
            localStorage.setItem(cacheKey, JSON.stringify(localRouteData));
            recalculateAndRender();
        }
    };

    window.actionCollect = (id) => {
        vibrate();
        window.location.href = `entry.html?custId=${id}`;
    };

    // --- 6. Instant Wake-Up / Visibility Loop ---
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
            const freshCache = localStorage.getItem(cacheKey);
            if(freshCache) localRouteData = JSON.parse(freshCache);
            pingGPS();
        }
    });

    // --- 7. Leaflet Map Engine (Google Road Tiles + Dark Filter Support) ---
    function initLeafletMap() {
        if(map) return; 
        
        map = L.map('map-container', { zoomControl: false }).setView([agentLocation.lat, agentLocation.lon], 15);
        
        // STANDARD GOOGLE ROAD TILES 
        // Note: The CSS `--map-filter` handles turning this into Dark Mode for night view
        const tileUrl = 'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}';

        L.tileLayer(tileUrl, {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        map.on('dragstart', () => {
            isMapLocked = false;
            document.getElementById('btn-map-lock').classList.remove('locked');
            document.getElementById('btn-map-lock').style.color = 'var(--text-main)';
            document.getElementById('btn-map-lock').style.borderColor = 'var(--border)';
            document.getElementById('btn-map-lock').style.background = 'var(--surface-card)';
        });

        setTimeout(() => map.invalidateSize(), 500);
    }

    window.toggleMapLock = () => {
        vibrate(15);
        isMapLocked = true;
        const lockBtn = document.getElementById('btn-map-lock');
        lockBtn.classList.add('locked');
        lockBtn.style.color = '#3b82f6';
        lockBtn.style.borderColor = '#3b82f6';
        lockBtn.style.background = 'rgba(59, 130, 246, 0.1)';
        centerMapOnAgent();
    };

    function updateAgentMarker() {
        if(!map) return;
        const agentIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background:#3b82f6; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 15px rgba(59,130,246,0.9); animation: pulseLoc 2s infinite;"></div>`,
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        if(agentMarker) {
            agentMarker.setLatLng([agentLocation.lat, agentLocation.lon]); 
        } else {
            agentMarker = L.marker([agentLocation.lat, agentLocation.lon], {icon: agentIcon, zIndexOffset: 2000}).addTo(map);
        }
    }

    function updateMapPins(activeList) {
        if(!map) return;

        Object.values(customerMarkers).forEach(m => map.removeLayer(m));
        customerMarkers = {};

        const bounds = L.latLngBounds([agentLocation.lat, agentLocation.lon]);

        activeList.forEach((c, index) => {
            if(c.lat && c.lon) {
                const isNearest = index === 0;
                const color = isNearest ? '#10B981' : '#6b7280';
                const zIndex = isNearest ? 1000 : 100;
                const stopNum = index + 1; // Dynamic Queue Number for Map Pin
                
                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background:${color}; width:24px; height:24px; border-radius:50%; border:3px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; color:white; font-size:12px; font-weight:800;">${stopNum}</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                const marker = L.marker([c.lat, c.lon], {icon: icon, zIndexOffset: zIndex}).addTo(map);
                marker.bindPopup(`<b>${c.name}</b><br>Stop #${stopNum}`);
                customerMarkers[c.id] = marker;
                bounds.extend([c.lat, c.lon]);
            }
        });

        if(isMapLocked && activeList.length > 0) {
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
        }
    }

    window.centerMapOnAgent = () => {
        vibrate(15);
        if(map) {
            map.setView([agentLocation.lat, agentLocation.lon], 16);
        }
    };

  </script>
</body>
</html>
