<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.json">
  <title>Up Field - Agent App</title>
  
  <style>
    /* System Default Theming (Matches Admin App) */
    :root {
      --bg-color: #f4f7f6;
      --surface-color: #ffffff;
      --text-main: #111827;
      --text-sub: #6b7280;
      --border: #e5e7eb;
      --primary: #10B981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --skeleton-base: #e5e7eb;
      --skeleton-highlight: #f3f4f6;
      --nav-height: 65px;
      --header-height: 60px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --text-main: #f9fafb;
        --text-sub: #9ca3af;
        --border: #2d3748;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        --skeleton-base: #2d3748;
        --skeleton-highlight: #3f4a5e;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

    body, html {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    /* --- Security Shields (Loading & Permission) --- */
    #loading-shield, #permission-shield {
      position: fixed;
      inset: 0;
      background-color: var(--bg-color);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    #permission-shield {
      display: none; /* Hidden until auth fails */
    }

    .shield-icon {
      width: 100px;
      height: 100px;
      color: var(--danger);
      margin-bottom: 25px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .shield-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }

    .shield-text {
      font-size: 1rem;
      color: var(--text-sub);
      line-height: 1.6;
      max-width: 320px;
      font-weight: 500;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

    /* --- Shell Layout --- */
    #app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      opacity: 0; /* Hidden until loaded */
      transition: opacity 0.3s ease;
    }

    #app-shell.ready {
      opacity: 1;
    }

    /* --- Header --- */
    header {
      height: var(--header-height);
      background-color: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .app-title span { color: var(--primary); }

    /* --- Profile DP Skeleton --- */
    .profile-wrapper {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--primary);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .profile-wrapper:active { transform: scale(0.9); }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .skeleton {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
      background-size: 200% 100%;
      animation: skeletonLoading 1.5s infinite;
    }
    @keyframes skeletonLoading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* --- Main Content Area (Iframe) --- */
    main {
      flex: 1;
      background-color: var(--bg-color);
      position: relative;
      overflow: hidden;
    }

    #content-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* --- Mobile Bottom Nav --- */
    .bottom-nav {
      display: flex;
      height: var(--nav-height);
      min-height: calc(var(--nav-height) + env(safe-area-inset-bottom));
      flex-shrink: 0;
      background-color: var(--bg-color);
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 100%;
      width: 100%;
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--text-sub);
      text-decoration: none;
      flex: 1;
      height: 100%;
    }

    .bottom-nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: all 0.2s; }
    .bottom-nav-item span { font-size: 0.7rem; font-weight: 700; }
    
    .bottom-nav-item.active { color: var(--primary); }
    .bottom-nav-item.active svg { transform: translateY(-2px); stroke-width: 2.5; }

    /* --- PWA Install Pill --- */
    #install-pill {
      position: fixed;
      bottom: calc(var(--nav-height) + 20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(150px);
      background-color: var(--primary);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      z-index: 100;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #install-pill.show { transform: translateX(-50%) translateY(0); }
    #install-pill:active { transform: translateX(-50%) translateY(2px) scale(0.95); }
  </style>
</head>
<body>

  <!-- 1. Initial Loading Shield -->
  <div id="loading-shield">
    <div class="spinner"></div>
  </div>

  <!-- 2. Security Permission Shield -->
  <div id="permission-shield">
    <!-- Beautiful SVG Lock/Shield Icon -->
    <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      <path d="M8 11h8v6H8z"></path>
      <path d="M10 11V9a2 2 0 0 1 4 0v2"></path>
    </svg>
    <div class="shield-title">Access Denied</div>
    <div class="shield-text">
      You are not an agent or your permission is missing. Kindly please contact the admin to grant the permission.
    </div>
  </div>

  <!-- 3. Main App Shell -->
  <div id="app-shell">
    
    <!-- Top Header -->
    <header>
      <div class="app-title">Up <span>Field</span></div>
      <!-- Profile Button dynamically redirects iframe to manage.html -->
      <div class="profile-wrapper" id="profile-btn">
        <div class="skeleton" id="dp-skeleton"></div>
        <img id="user-dp" class="profile-img" alt="Profile">
      </div>
    </header>

    <!-- Main Content Area -->
    <main>
      <iframe src="home.html" id="content-frame" name="content-frame" title="Main Content"></iframe>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <!-- Home / Map -->
        <a href="home.html" class="bottom-nav-item active" target="content-frame" onclick="setActiveNav(this, 0)">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Home</span>
        </a>
        <!-- Entry / Log -->
        <a href="entry.html" class="bottom-nav-item" target="content-frame" onclick="setActiveNav(this, 1)">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          <span>Entry</span>
        </a>
        <!-- Submit / Verify -->
        <a href="submit.html" class="bottom-nav-item" target="content-frame" onclick="setActiveNav(this, 2)">
          <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <span>Submit</span>
        </a>
        <!-- Reports / History -->
        <a href="reports.html" class="bottom-nav-item" target="content-frame" onclick="setActiveNav(this, 3)">
          <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>Reports</span>
        </a>
      </div>
    </nav>
  </div>

  <!-- 4. Install App Pill -->
  <div id="install-pill">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Install App
  </div>

  <script type="module">
    import { auth, db } from './config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('SW Registered!', reg);
        }).catch(err => console.log('SW Registration Failed', err));
      });
    }

    // --- Core UI Elements ---
    const loadingShield = document.getElementById('loading-shield');
    const permissionShield = document.getElementById('permission-shield');
    const appShell = document.getElementById('app-shell');
    const dpImg = document.getElementById('user-dp');
    const dpSkeleton = document.getElementById('dp-skeleton');

    // --- 0ms LocalStorage Profile Picture Loading ---
    const localDpUrl = localStorage.getItem('upfield_dp');
    if (localDpUrl) {
      dpImg.src = localDpUrl;
      dpImg.style.opacity = '1';
      dpSkeleton.classList.add('hidden');
    }

    // --- Strict Auth & Agent Validation ---
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // Not logged in -> Redirect to global login
        window.location.replace("login.html");
        return;
      }

      try {
        // User is logged in. Fetch their specific user document.
        const userDocRef = doc(db, "users", user.uid);
        const userDoc = await getDoc(userDocRef);

        // Security Check: Ensure the user exists AND is explicitly marked as an Agent
        if (userDoc.exists() && userDoc.data().isAgent === true) {
          
          // Access Granted: Hide loader, show app shell
          loadingShield.style.display = 'none';
          appShell.classList.add('ready');

          // Handle Profile Picture Sync
          if (user.photoURL && user.photoURL !== localDpUrl) {
            const tempImg = new Image();
            tempImg.onload = () => {
              dpImg.src = tempImg.src;
              dpImg.style.opacity = '1';
              dpSkeleton.classList.add('hidden');
              localStorage.setItem('upfield_dp', tempImg.src); 
            };
            tempImg.src = user.photoURL;
          } else if (!user.photoURL && !localDpUrl) {
             dpSkeleton.classList.add('hidden');
          }

        } else {
          // Access Denied: User is logged in but `isAgent` is false or missing
          loadingShield.style.display = 'none';
          permissionShield.style.display = 'flex';
        }
      } catch (error) {
        console.error("Error verifying agent permission:", error);
        loadingShield.style.display = 'none';
        permissionShield.style.display = 'flex'; // Fail safe: block access on error
      }
    });

    // --- Haptics & UI Interactions ---
    function triggerVibration() {
      if (navigator.vibrate) navigator.vibrate(30);
    }

    // Navigation Sync Logic (Switches active state on Bottom Nav)
    window.setActiveNav = function(clickedElement, index) {
      triggerVibration();
      
      const bottomNavItems = document.querySelectorAll('.bottom-nav-item');
      bottomNavItems.forEach(item => item.classList.remove('active'));
      
      if (bottomNavItems[index]) {
        bottomNavItems[index].classList.add('active');
      }
    };

    // Profile Click Navigation (Dynamically redirect to manage.html)
    document.getElementById('profile-btn').addEventListener('click', () => {
      triggerVibration();
      // Load manage.html inside the main content iframe
      document.getElementById('content-frame').src = 'manage.html';
      
      // Clear active states on bottom nav to indicate we are not on a main tab
      const bottomNavItems = document.querySelectorAll('.bottom-nav-item');
      bottomNavItems.forEach(item => item.classList.remove('active'));
    });

    // --- PWA Install Pill Logic ---
    let deferredPrompt;
    const installPill = document.getElementById('install-pill');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        installPill.classList.add('show');
      }, 2500); 
    });

    installPill.addEventListener('click', async () => {
      triggerVibration();
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('Up Field App Installed');
        }
        deferredPrompt = null;
        installPill.classList.remove('show');
      }
    });

    window.addEventListener('appinstalled', () => {
      installPill.classList.remove('show');
      deferredPrompt = null;
    });

  </script>
</body>
</html>
