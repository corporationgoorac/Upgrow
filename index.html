<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Account - Up Field</title>
  
  <style>
    /* Shared Theme Variables */
    :root {
      --bg-color: #f4f7f6;
      --surface-color: #ffffff;
      --surface-card: #ffffff;
      --text-main: #111827;
      --text-sub: #6b7280;
      --border: #e5e7eb;
      --primary: #10B981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #121212;
        --surface-card: #1e1e1e;
        --text-main: #f9fafb;
        --text-sub: #9ca3af;
        --border: #2d3748;
        --shadow: 0 8px 30px -5px rgba(0, 0, 0, 0.6);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none !important; }
    body { background-color: var(--bg-color); color: var(--text-main); overflow: hidden; }

    /* --- Screen Management --- */
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1); z-index: 1; background: var(--bg-color); overflow-y: auto; }
    .screen.hidden { opacity: 0; pointer-events: none; z-index: -1; transform: translateY(20px); }

    /* --- Screen 1: Login --- */
    .login-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; }
    .brand-logo { width: 90px; height: 90px; border-radius: 20px; margin-bottom: 20px; box-shadow: var(--shadow); object-fit: cover; }
    .login-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; color: var(--text-main); }
    .login-sub { font-size: 1rem; color: var(--text-sub); margin-bottom: 40px; font-weight: 500; }
    
    .input-group { width: 100%; max-width: 350px; position: relative; margin-bottom: 20px; }
    .input-field { width: 100%; padding: 18px 20px; font-size: 1.1rem; border-radius: 16px; border: 2px solid var(--border); background: var(--surface-card); color: var(--text-main); outline: none; transition: border-color 0.2s; font-weight: 600; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
    .input-field:focus { border-color: var(--primary); }
    
    .btn-submit { width: 100%; max-width: 350px; padding: 18px; border-radius: 16px; border: none; background: var(--primary); color: white; font-size: 1.2rem; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .btn-submit:active { transform: scale(0.96); }
    .error-msg { color: var(--danger); font-size: 0.9rem; font-weight: 700; margin-top: 15px; display: none; }

    /* --- Screen 2: Dashboard --- */
    .dash-header { padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(var(--bg-color), 0.9); backdrop-filter: blur(10px); z-index: 5; }
    .dash-greeting h2 { font-size: 1.4rem; font-weight: 800; }
    .dash-greeting p { font-size: 0.9rem; color: var(--text-sub); font-weight: 600; }
    .dash-logo { width: 40px; height: 40px; border-radius: 50%; }

    .dash-content { padding: 0 20px 40px 20px; }
    
    /* Master Balance Card */
    .master-card { background: linear-gradient(135deg, #111827, #374151); padding: 30px 20px; border-radius: 24px; color: white; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 30px; position: relative; overflow: hidden; }
    @media (prefers-color-scheme: dark) { .master-card { background: linear-gradient(135deg, #1f2937, #111827); border: 1px solid var(--border); } }
    .master-card-label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; margin-bottom: 8px; font-weight: 700; }
    .master-card-amt { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }

    /* Product Cards */
    .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
    
    .product-card { background: var(--surface-card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: var(--shadow); transition: transform 0.1s; cursor: pointer; }
    .product-card:active { transform: scale(0.97); }
    .pc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .pc-title { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }
    .pc-arrow { color: var(--text-sub); opacity: 0.5; }

    .pc-stats { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .pc-stat-col { display: flex; flex-direction: column; }
    .pc-stat-label { font-size: 0.8rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .pc-stat-val { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
    .pc-stat-val.balance { color: var(--primary); }

    /* Product Progress Bar */
    .prod-progress-bg { width: 100%; height: 8px; background: var(--border); border-radius: 10px; overflow: hidden; margin-top: 5px; }
    .prod-progress-fill { height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    /* --- Bottom Sheet Routing Engine (Ledger) --- */
    .ledger-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .ledger-overlay.visible { opacity: 1; pointer-events: auto; }

    .ledger-panel { position: fixed; bottom: 0; left: 0; width: 100%; height: 85vh; background: var(--surface-card); z-index: 50; border-top-left-radius: 30px; border-top-right-radius: 30px; box-shadow: 0 -10px 40px rgba(0,0,0,0.3); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1); transform: translateY(100%); display: flex; flex-direction: column; will-change: transform; }
    .ledger-panel.expanded { transform: translateY(0); }
    
    .panel-handle-area { padding: 15px 0; display: flex; justify-content: center; cursor: grab; flex-shrink: 0; touch-action: none; position: relative; margin-top: 5px; }
    .panel-handle-area:active { cursor: grabbing; }
    .panel-handle { width: 50px; height: 6px; background: var(--border); border-radius: 10px; }

    .panel-content { padding: 0 20px 40px 20px; overflow-y: auto; flex: 1; position: relative; }
    .ledger-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; color: var(--text-main); text-align: center; }

    /* Timeline UI */
    .timeline { position: relative; padding-left: 20px; margin-top: 10px; }
    .timeline::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 0; width: 2px; background: var(--border); border-radius: 2px; }
    
    .timeline-item { position: relative; margin-bottom: 25px; padding-left: 20px; }
    .timeline-dot { position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-card); border: 2px solid var(--primary); z-index: 2; }
    .timeline-dot.failed { border-color: var(--danger); }
    .timeline-dot.processing { border-color: var(--warning); box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2); animation: pulseWarn 2s infinite; }
    @keyframes pulseWarn { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }

    .tl-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .tl-date { font-size: 0.85rem; color: var(--text-sub); font-weight: 700; }
    .tl-amount { font-size: 1.15rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
    
    .tl-type-icon { width: 16px; height: 16px; color: var(--text-sub); }
    
    /* Dynamic Badges */
    .badge { padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge.success { background: rgba(16, 185, 129, 0.1); color: var(--primary); }
    .badge.processing { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
    .badge.failed { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    /* Loaders */
    .loader-circle { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; display: none; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ================= SCREEN 1: LOGIN ================= -->
  <div id="screen-login" class="screen">
    <div class="login-container">
      <img src="admin/images/icon.png" alt="Up Field Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1 class="login-title">Up Field</h1>
      <p class="login-sub">Secure Customer Portal</p>

      <div class="input-group">
        <input type="text" id="cust-id-input" class="input-field" placeholder="Enter your Customer ID" autocomplete="off" autocorrect="off" autocapitalize="off">
      </div>
      
      <button class="btn-submit" id="btn-view-acc" onclick="handleLogin()">
        <span id="btn-text">View My Account</span>
        <div id="btn-loader" class="loader-circle" style="width:24px; height:24px; border-width:3px; border-top-color:white; display:none;"></div>
      </button>

      <div id="login-error" class="error-msg">Customer ID not found. Please check and try again.</div>
    </div>
  </div>

  <!-- ================= SCREEN 2: DASHBOARD ================= -->
  <div id="screen-dashboard" class="screen hidden">
    
    <div class="dash-header">
      <div class="dash-greeting">
        <h2>Hello, <span id="dash-cust-name">Customer</span></h2>
        <p>Your Account Overview</p>
      </div>
      <img src="admin/images/icon.png" class="dash-logo" onerror="this.style.display='none'">
    </div>

    <div class="dash-content">
      
      <!-- Big Master Card -->
      <div class="master-card">
        <div class="master-card-label">Total Outstanding Balance</div>
        <div class="master-card-amt" id="dash-total-balance">₹0</div>
      </div>

      <div class="section-title">
        Active Products <span id="prod-count-badge" style="background:var(--border); padding:4px 10px; border-radius:12px; font-size:0.8rem;">0</span>
      </div>

      <!-- Injected Product Cards go here -->
      <div id="products-container"></div>

    </div>
  </div>

  <!-- ================= SCREEN 3: LEDGER BOTTOM SHEET ================= -->
  <div class="ledger-overlay" id="ledger-overlay" onclick="closeLedger()"></div>
  
  <div class="ledger-panel" id="ledger-panel">
    
    <!-- Draggable Handle Area (Vibration Trigger Attached Here) -->
    <div class="panel-handle-area" id="panel-drag-handle">
        <div class="panel-handle"></div>
    </div>

    <div class="panel-content" id="panel-content">
        <h3 class="ledger-title" id="ledger-product-name">Product Details</h3>
        
        <div class="pc-stats" style="margin-bottom: 25px; border-bottom: 1px dashed var(--border); padding-bottom: 20px;">
            <div class="pc-stat-col">
                <span class="pc-stat-label">Total Value</span>
                <span class="pc-stat-val" id="ledger-total-val">₹0</span>
            </div>
            <div class="pc-stat-col" style="text-align: right;">
                <span class="pc-stat-label">Pending</span>
                <span class="pc-stat-val balance" id="ledger-pending-val" style="font-size: 1.3rem;">₹0</span>
            </div>
        </div>

        <div class="section-title" style="margin-bottom: 5px;">Payment History</div>
        
        <!-- Injected Timeline Rows go here -->
        <div class="timeline" id="timeline-container"></div>

    </div>
  </div>

  <script type="module">
    import { db } from './admin/config.js';
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // Global State
    let activeCustomerData = null;
    const fmt = (num) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);
    const vibrate = (ms = 30) => { if(navigator.vibrate) navigator.vibrate(ms); };

    // --- 1. Initialization & Auto-Redirect ---
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const autoCustId = urlParams.get('custId');
        
        if (autoCustId) {
            document.getElementById('cust-id-input').value = autoCustId;
            handleLogin(); // Auto trigger fetch
        }

        // Allow Enter key in input
        document.getElementById('cust-id-input').addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleLogin();
        });

        // Auto format input: Uppercase and remove gaps dynamically
        document.getElementById('cust-id-input').addEventListener("input", function(e) {
            this.value = this.value.toUpperCase().replace(/\s/g, '');
        });
    });

    // --- 2. Secure Data Fetching ---
    window.handleLogin = async () => {
        const rawId = document.getElementById('cust-id-input').value.trim();
        if (!rawId) return;

        vibrate(10);
        setLoadingState(true);
        document.getElementById('login-error').style.display = 'none';

        try {
            // Priority 1: Direct Document ID Lookup
            let custDoc = await getDoc(doc(db, "customers", rawId));
            let data = null;

            if (custDoc.exists()) {
                data = custDoc.data();
            } else {
                // Priority 2: Field Search Fallback (if ID is custom)
                const q = query(collection(db, "customers"), where("id", "==", rawId));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    data = snap.docs[0].data();
                }
            }

            if (data) {
                activeCustomerData = data;
                
                // --- NEW OPTIMIZED LOW-READ QUERY (INJECTED WITHOUT REMOVING OLD LINES) ---
                try {
                    const logsQuery = query(
                        collection(db, "daily_logs"), 
                        where("activeCustomers", "array-contains", rawId) 
                    );
                    const logsSnap = await getDocs(logsQuery);
                    
                    logsSnap.forEach(d => {
                        const logData = d.data();
                        Object.keys(logData).forEach(key => {
                            if (key.startsWith(rawId + "_")) {
                                const entry = logData[key];
                                const pIndex = parseInt(key.split("_")[1]);
                                
                                if(entry.status === 'pending' || entry.status === 'submitted') {
                                    if (activeCustomerData.products && activeCustomerData.products[pIndex]) {
                                        if (!activeCustomerData.products[pIndex].payments) {
                                            activeCustomerData.products[pIndex].payments = [];
                                        }
                                        activeCustomerData.products[pIndex].payments.push({
                                            amount: entry.amount,
                                            date: entry.timestamp,
                                            status: entry.status, // "pending" or "submitted"
                                            method: entry.method || entry.type
                                        });
                                    }
                                }
                            }
                        });
                    });
                } catch (err) {
                    console.warn("Could not fetch logs:", err);
                }
                // --------------------------------------------------------------------------

                renderDashboard();
                
                // Seamless Transition
                document.getElementById('screen-login').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('screen-login').classList.add('hidden');
                    document.getElementById('screen-dashboard').classList.remove('hidden');
                    
                    // Trigger Progress Bar Animations smoothly after reveal
                    setTimeout(() => {
                        document.querySelectorAll('.prod-progress-fill').forEach(el => {
                            el.style.width = el.getAttribute('data-target-width');
                        });
                    }, 100);
                }, 400);

            } else {
                throw new Error("Not Found");
            }

        } catch (error) {
            console.error("Login Error:", error);
            document.getElementById('login-error').style.display = 'block';
            vibrate([20, 50, 20]); // Error vibration pattern
        } finally {
            setLoadingState(false);
        }
    };

    function setLoadingState(isLoading) {
        document.getElementById('btn-text').style.display = isLoading ? 'none' : 'block';
        document.getElementById('btn-loader').style.display = isLoading ? 'block' : 'none';
        document.getElementById('btn-view-acc').style.pointerEvents = isLoading ? 'none' : 'auto';
    }

    // --- 3. Rendering The Dashboard ---
    function renderDashboard() {
        document.getElementById('dash-cust-name').innerText = activeCustomerData.name || "Valued Customer";
        
        const container = document.getElementById('products-container');
        container.innerHTML = '';
        let globalPending = 0;
        let activeProdCount = 0;

        if (!activeCustomerData.products || activeCustomerData.products.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 40px 20px; color:var(--text-sub);">No active products found on your account.</div>`;
            document.getElementById('dash-total-balance').innerText = '₹0';
            return;
        }

        activeCustomerData.products.forEach((prod, index) => {
            const pTotal = parseInt(prod.total) || parseInt(prod.amount) || 0;
            
            // let pPaid = 0; // <--- OLD LINE COMMENTED OUT
            
            // if (prod.payments) { // <--- OLD LINE COMMENTED OUT
            //     prod.payments.forEach(pay => { // <--- OLD LINE COMMENTED OUT
            //         // Only count successful/paid statuses towards actual paid amount // <--- OLD LINE COMMENTED OUT
            //         const status = (pay.status || "success").toLowerCase(); // <--- OLD LINE COMMENTED OUT
            //         if(status === "success" || status === "paid" || status === "completed") { // <--- OLD LINE COMMENTED OUT
            //             pPaid += (parseInt(pay.amount) || 0); // <--- OLD LINE COMMENTED OUT
            //         } // <--- OLD LINE COMMENTED OUT
            //     }); // <--- OLD LINE COMMENTED OUT
            // } // <--- OLD LINE COMMENTED OUT

            // const pPending = Math.max(0, pTotal - pPaid); // <--- OLD LINE COMMENTED OUT
            // globalPending += pPending; // <--- OLD LINE COMMENTED OUT
            // activeProdCount++; // <--- OLD LINE COMMENTED OUT

            // Calculate Progress % // <--- OLD LINE COMMENTED OUT
            // let progressPercent = pTotal > 0 ? Math.round((pPaid / pTotal) * 100) : 0; // <--- OLD LINE COMMENTED OUT
            // if(progressPercent > 100) progressPercent = 100; // <--- OLD LINE COMMENTED OUT
            
            // --- NEW INJECTED MATH ENGINE ---
            let pPaid = 0;
            let pProcessing = 0; // <--- NEW: Track pending drafts
            
            if (prod.payments) {
                prod.payments.forEach(pay => {
                    const status = (pay.status || "success").toLowerCase();
                    const amt = parseInt(pay.amount) || 0;
                    if(status === "success" || status === "paid" || status === "completed") {
                        pPaid += amt;
                    } else if (status === "pending" || status === "submitted" || status === "processing") {
                        pProcessing += amt; // <--- NEW: Add to processing
                    }
                });
            }

            const pPending = Math.max(0, pTotal - pPaid - pProcessing); // <--- NEW: Deduct both
            globalPending += pPending;
            activeProdCount++;

            let progressPercent = pTotal > 0 ? Math.round(((pPaid + pProcessing) / pTotal) * 100) : 0; // <--- NEW: Include processing in progress
            if(progressPercent > 100) progressPercent = 100;
            // ---------------------------------

            const card = document.createElement('div');
            card.className = 'product-card';
            card.onclick = () => openLedger(index, pTotal, pPending, prod);
            
            card.innerHTML = `
                <div class="pc-header">
                    <div class="pc-title">${prod.name || 'Product Detail'}</div>
                    <svg class="pc-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
                <div class="pc-stats">
                    <div class="pc-stat-col">
                        <span class="pc-stat-label">Total</span>
                        <span class="pc-stat-val">${fmt(pTotal)}</span>
                    </div>
                    <div class="pc-stat-col" style="text-align: right;">
                        <span class="pc-stat-label">Balance</span>
                        <span class="pc-stat-val balance">${fmt(pPending)}</span>
                    </div>
                </div>
                <div class="prod-progress-bg">
                    <div class="prod-progress-fill" data-target-width="${progressPercent}%" style="width: 0%;"></div>
                </div>
                <div style="font-size:0.75rem; color:var(--text-sub); text-align:right; margin-top:6px; font-weight:700;">${progressPercent}% Paid</div>
            `;
            container.appendChild(card);
        });

        document.getElementById('dash-total-balance').innerText = fmt(globalPending);
        document.getElementById('prod-count-badge').innerText = activeProdCount;
    }

    // --- 4. Rendering The Ledger Bottom Sheet ---
    window.openLedger = (index, total, pending, prod) => {
        vibrate(15);
        document.getElementById('ledger-product-name').innerText = prod.name || 'Product Details';
        document.getElementById('ledger-total-val').innerText = fmt(total);
        document.getElementById('ledger-pending-val').innerText = fmt(pending);
        
        const tlContainer = document.getElementById('timeline-container');
        tlContainer.innerHTML = '';

        if (!prod.payments || prod.payments.length === 0) {
            tlContainer.innerHTML = `<div style="color:var(--text-sub); padding: 20px 0; font-weight:600;">No payments recorded yet.</div>`;
        } else {
            // Clone and sort payments by date descending (newest first)
            const sortedPayments = [...prod.payments].sort((a, b) => {
                const dateA = new Date(a.date || a.timestamp || 0);
                const dateB = new Date(b.date || b.timestamp || 0);
                return dateB - dateA;
            });

            sortedPayments.forEach(pay => {
                const pAmt = parseInt(pay.amount) || 0;
                
                // Format Date safely
                let dateStr = "Unknown Date";
                try {
                    const rawDate = pay.date || pay.timestamp;
                    if(rawDate) {
                        const d = new Date(rawDate);
                        dateStr = d.toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
                    }
                } catch(e){}

                // Interpret Status
                const rawStatus = (pay.status || "success").toLowerCase();
                let statusClass = "success";
                let statusText = "Paid";
                
                if(rawStatus.includes("process") || rawStatus.includes("pend")) {
                    statusClass = "processing";
                    statusText = "Processing";
                } else if(rawStatus.includes("fail") || rawStatus.includes("reject")) {
                    statusClass = "failed";
                    statusText = "Failed";
                } else if(rawStatus === "success" || rawStatus === "paid" || rawStatus === "completed") {
                    statusClass = "success";
                    statusText = "Successful";
                }

                // Interpret Type (Cash vs Online)
                const rawType = (pay.type || pay.method || "cash").toLowerCase();
                let typeIcon = '';
                if(rawType.includes("online") || rawType.includes("upi") || rawType.includes("bank")) {
                    typeIcon = `<svg class="tl-type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>`; // Smartphone icon
                } else {
                    typeIcon = `<svg class="tl-type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>`; // Cash bill icon
                }

                const item = document.createElement('div');
                item.className = `timeline-item`;
                item.innerHTML = `
                    <div class="timeline-dot ${statusClass}"></div>
                    <div class="tl-header">
                        <span class="tl-date">${dateStr}</span>
                        <span class="badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="tl-header" style="margin-bottom:0;">
                        <span class="tl-amount">${typeIcon} ${fmt(pAmt)}</span>
                    </div>
                `;
                tlContainer.appendChild(item);
            });
        }

        // Show Sheet
        document.getElementById('ledger-overlay').classList.add('visible');
        const panel = document.getElementById('ledger-panel');
        panel.classList.add('expanded');
        panel.style.transform = ''; // Clear inline styles
    };

    window.closeLedger = () => {
        vibrate(15);
        document.getElementById('ledger-overlay').classList.remove('visible');
        const panel = document.getElementById('ledger-panel');
        panel.classList.remove('expanded');
        panel.style.transform = '';
    };

    // --- 5. Haptic Swipe Physics for Ledger Sheet ---
    const panel = document.getElementById('ledger-panel');
    const dragHandle = document.getElementById('panel-drag-handle');
    const panelContent = document.getElementById('panel-content');
    
    let startY = 0;
    let currentY = 0;
    let isDraggingContent = false;

    // Handle Dragging
    dragHandle.addEventListener('touchstart', (e) => {
        vibrate(10); 
        startY = e.touches[0].clientY;
        panel.style.transition = 'none'; 
    }, {passive: true});
    
    dragHandle.addEventListener('touchmove', (e) => {
        currentY = e.touches[0].clientY;
        const deltaY = currentY - startY;
        if(deltaY > 0) { // Only allow dragging downwards to close
            panel.style.transform = `translateY(${deltaY}px)`;
        }
    }, {passive: true});
    
    dragHandle.addEventListener('touchend', finalizeDrag);

    // Scroll Area Dragging (Pull down to dismiss when at top)
    panelContent.addEventListener('touchstart', (e) => {
        if (panelContent.scrollTop <= 0) {
            startY = e.touches[0].clientY;
            isDraggingContent = true;
            panel.style.transition = 'none';
        }
    }, {passive: true});
    
    panelContent.addEventListener('touchmove', (e) => {
        if (!isDraggingContent) return;
        currentY = e.touches[0].clientY;
        const deltaY = currentY - startY;
        if (deltaY > 0) { 
            panel.style.transform = `translateY(${deltaY}px)`;
        }
    }, {passive: true});
    
    panelContent.addEventListener('touchend', () => {
        if(isDraggingContent) { isDraggingContent = false; finalizeDrag(); }
    });

    function finalizeDrag() {
        panel.style.transition = 'transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1)';
        const deltaY = currentY - startY;
        
        // If dragged down more than 150px, close it. Otherwise, snap back up.
        if (deltaY > 150) {
            closeLedger();
        } else {
            panel.style.transform = ''; // Snap to expanded
            vibrate(20);
        }
        
        startY = 0;
        currentY = 0;
    }

  </script>
</body>
</html>
